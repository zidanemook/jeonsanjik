name: Deploy study app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 검사는 배포와 나란히 돈다. 올리기 전에 같은 검사를 PC에서 먼저 돌리므로(research/structure-audit-20261009/ci.sh) 배포는 기다리지 않는다(2026-10-10 사용자: 반영이 오래 걸림).
  # 여기서 실패하면 GitHub이 메일로 알린다. 이미 나간 판은 그대로이므로 고친 판을 다시 올린다.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build-chunks.cjs --check && node scheduler.test.cjs && node learning.test.cjs && node sync-core.test.cjs && node sync.test.cjs && node sync-session.test.cjs && node topics.test.cjs && node build-config.test.cjs && node practice.test.cjs && node review-policy.test.cjs && node app.test.cjs && node content-audit.cjs && node study-credit.test.cjs && node sync-explanations.test.cjs && node sync-notes.test.cjs && node memorize.test.cjs && node hanneung.test.cjs && node study-review.test.cjs && node access.test.cjs && node xp.test.cjs && node score.test.cjs && node parts.test.cjs && node badges.test.cjs && node basics.test.cjs && node core20.test.cjs && node lazy.test.cjs && node storage.test.cjs && node middle-dot.test.cjs && node exercise-alias.test.cjs && node update.test.cjs
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Stage app
        env:
          STUDY_FIREBASE_CONFIG: ${{ secrets.STUDY_FIREBASE_CONFIG }}
        run: |
          mkdir _site
          cp version.js update.js storage.js content-index.js content-store.js chunk-manifest.json xp.js score.js parts.js part-check.js core-units.js hanneung-topics.js topics.js study-credit.js index.html app.js practice.js content-corrections.js review-record.js review-policy.js sync-core.js sync.js scheduler.js learning.js style.css sw.js manifest.json icon.svg _site/
          cp -r chunks _site/
          cp -r vendor _site/
          cp hanneung-data.js hanneung.js _site/
          cp gichul-index.js gichul.js _site/
          cp -r gichul _site/
          cp -r assets _site/
          node build-config.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
