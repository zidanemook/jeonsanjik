name: Deploy study app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scheduler.test.cjs && node learning.test.cjs && node sync-core.test.cjs && node sync.test.cjs
      - uses: actions/configure-pages@v5
      - name: Stage app
        run: |
          mkdir _site
          cp index.html app.js core-review-pack.js quiz-options.js sync-core.js sync.js firebase-config.js scheduler.js learning.js style.css sw.js manifest.json icon.svg _site/
          cp -r vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
