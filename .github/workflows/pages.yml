name: Deploy study app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scheduler.test.cjs && node learning.test.cjs && node sync-core.test.cjs && node sync.test.cjs && node sync-session.test.cjs && node topics.test.cjs && node build-config.test.cjs && node practice.test.cjs && node review-policy.test.cjs && node drill.test.cjs && node drill-app.test.cjs && node content-audit.cjs && node study-credit.test.cjs && node sync-explanations.test.cjs && node hanneung.test.cjs && node study-review.test.cjs && node access.test.cjs
      - uses: actions/configure-pages@v5
      - name: Stage app
        env:
          STUDY_FIREBASE_CONFIG: ${{ secrets.STUDY_FIREBASE_CONFIG }}
        run: |
          mkdir _site
          cp study-review-catalog.js hanneung-topics.js topics.js study-credit.js index.html app.js core-review-pack.js quiz-options.js practice-bank.js practice.js content-corrections.js review-record.js review-policy.js drill.js sync-core.js sync.js scheduler.js learning.js style.css sw.js manifest.json icon.svg _site/
          cp -r vendor _site/
          cp hanneung-data.js hanneung-explanations.js hanneung.js _site/
          cp gichul-data.js gichul.js _site/
          cp -r assets _site/
          node build-config.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
